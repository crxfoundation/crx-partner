[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crx-partner"
version = "0.1.0"
description = "Python SDK for the CRX Manage API"
readme = "README.md"
license = "LicenseRef-CRX-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "cryptography>=41",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/crxfoundation/crx-partner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crx_partner = ["py.typed"]
